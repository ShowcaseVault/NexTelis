[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[endpoint-template](!)
type=endpoint
transport=transport-udp
context=phones
disallow=all
allow=ulaw
allow=alaw
dtmf_mode=rfc4733
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[aor-template](!)
type=aor
max_contacts=5
remove_existing=yes
support_path=yes

[auth-template](!)
type=auth
auth_type=userpass

; ── Static phones ─────────────────────────────────────────
[phone1](endpoint-template)
auth=phone1_auth
aors=phone1
callerid="Phone 1" <101>

[phone1](aor-template)

[phone1_auth](auth-template)
username=phone1
password=secret123

[phone2](endpoint-template)
auth=phone2_auth
aors=phone2
callerid="Phone 2" <102>

[phone2](aor-template)

[phone2_auth](auth-template)
username=phone2
password=secret456

; ── Dynamic users (written by backend on signup) ──────────
#include "/etc/asterisk/dynamic/dynamic_users.conf"